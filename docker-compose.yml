services:
  jupyter:
    build: ./docker
    container_name: bda2-jupyter
    ports:
      - "8888:8888"   # JupyterLab
      - "4040:4040"   # Spark UI
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-bda2}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4jpassword}
    volumes:
      - .:/home/jovyan/work
    working_dir: /home/jovyan/work
    mem_limit: 16g

  # Chapter VI only: docker compose --profile graph up -d
  neo4j:
    image: neo4j:5.26
    container_name: bda2-neo4j
    profiles: ["graph"]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4jpassword}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 8G
      NEO4J_server_memory_heap_max__size: 10G
      NEO4J_server_memory_pagecache_size: 6G
      NEO4J_dbms_security_procedures_unrestricted: gds.*,apoc.*
    volumes:
      - neo4j-data:/data
      - ./data/neo4j-import:/import

volumes:
  neo4j-data:
