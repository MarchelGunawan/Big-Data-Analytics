services:
  postgres:
    image: postgres:16
    container_name: bda-postgres
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset_meta
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d bda"]
      interval: 5s
      retries: 20

  superset:
    build: .
    container_name: bda-superset
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERSET_METADATA_URI: postgresql+psycopg2://superset:superset@postgres:5432/superset_meta
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    ports:
      - "8088:8088"
    volumes:
      - ./config/superset_config.py:/app/pythonpath/superset_config.py:ro
    command:
      - /bin/sh
      - -c
      - |
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin || true
        superset init &&
        /usr/bin/run-server.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8088/health || exit 1"]
      interval: 10s
      retries: 30

volumes:
  pgdata:
